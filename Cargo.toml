[workspace]
members = ["attestcoin-abi-encoding", "attestcoin-query-builder"]
resolver = "3"

[workspace.package]
license = "Unlicense"
repository = "https://github.com/gluwa/attestcoin-sdk-rs"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
alloy = { version = "~1.6", features = [
  "node-bindings",
  "providers",
  "provider-http",
  "provider-ws",
  "rpc-client",
  "rpc-types",
  "rpc-types-eth",
  "consensus",
  "rlp",
  "contract",
  "sol-types",
  "signers",
] }
alloy-json-abi = { version = "1.4" }
tokio = { version = "1" }
hex = { version = "0.4" }
# Pinned to avoid issues with alloy
serde = { version = "1.0" }
serde_json = { version = "1.0" }

attestcoin-abi-encoding = { path = "attestcoin-abi-encoding" }
